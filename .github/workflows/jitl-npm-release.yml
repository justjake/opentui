name: JITL NPM Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: true
        default: "next"
        type: choice
        options:
          - stable
          - next
          - branch
      dryRun:
        description: "Run npm publish --dry-run instead of publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13
  NODE_VERSION: 22
  ZIG_VERSION: 0.15.2
  NPM_SCOPE: "@jitl"
  NPM_PACKAGE_PREFIX: "opentui-"

jobs:
  build_tarballs:
    name: Test, build, create tarballs
    if: github.repository == 'justjake/opentui'
    runs-on: macos-latest
    outputs:
      mode: ${{ steps.publish_plan.outputs.mode }}
      version: ${{ steps.publish_plan.outputs.version }}
      npm_tag: ${{ steps.publish_plan.outputs.npm_tag }}
      dry_run: ${{ steps.publish_plan.outputs.dry_run }}
      package_name: ${{ steps.publish_plan.outputs.package_name }}
      url: ${{ steps.publish_plan.outputs.url }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Plan publish
        id: publish_plan
        run: |
          set -euo pipefail

          source_version="$(bun -e "console.log(require('./packages/core/package.json').version)")"
          release_type="${{ inputs.type }}"
          package_name="${NPM_SCOPE}/${NPM_PACKAGE_PREFIX}core"
          short_sha="${GITHUB_SHA::7}"

          if [ -z "${release_type}" ]; then
            release_type="stable"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dry_run="${{ inputs.dryRun }}"
          else
            dry_run="false"
          fi

          emit() {
            {
              echo "mode=$1"
              echo "package_name=${package_name}"
              echo "version=$2"
              echo "npm_tag=$3"
              echo "dry_run=${dry_run}"
              echo "url=https://www.npmjs.com/package/${package_name}/v/$2"
            } >> "$GITHUB_OUTPUT"
          }

          sanitize_prerelease_part() {
            bun -e "
              const value = process.argv[1]
              const sanitized = value
                .replace(/[^0-9A-Za-z-]+/g, '-')
                .replace(/^-+|-+$/g, '')
              process.stdout.write(sanitized || 'detached')
            " -- "$1"
          }

          case "${release_type}" in
            stable)
              package_version="${source_version}"
              npm_tag="latest"
              ;;
            next)
              package_version="${source_version}-next.${short_sha}"
              npm_tag="next"
              ;;
            branch)
              branch_name="${GITHUB_REF_NAME:-detached}"
              sanitized_branch="$(sanitize_prerelease_part "${branch_name}")"
              package_version="${source_version}-branch-${sanitized_branch}-${short_sha}"
              npm_tag="experimental"
              ;;
            *)
              echo "Invalid release type: ${release_type}" >&2
              exit 1
              ;;
          esac

          if [ "${dry_run}" = "true" ]; then
            emit dry-run "${package_version}" "${npm_tag}"
            exit 0
          fi

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            emit skip "${package_version}" "${npm_tag}"
            echo "Version ${package_version} is already published; skipping publish."
          else
            emit "${release_type}" "${package_version}" "${npm_tag}"
            echo "Will publish ${package_name}@${package_version} with dist-tag ${npm_tag}."
          fi

      - name: Prepare release versions
        if: steps.publish_plan.outputs.mode != 'skip'
        run: bun scripts/prepare-release.ts "${{ steps.publish_plan.outputs.version }}"

      - name: Build package artifacts
        if: steps.publish_plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          cd packages/core
          bun run build:native --all
          bun run build:lib

          cd ../qrcode
          bun run build

          cd ../three
          bun run build

          cd ../solid
          bun run build

          cd ../react
          bun run build

          cd ../keymap
          bun run build

      - name: Test package artifacts
        if: steps.publish_plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          cd packages/core
          bun run test:native
          bun run test:js

          cd ../qrcode
          bun run test

          cd ../three
          bun run test

          cd ../solid
          bun run test:bun

          cd ../react
          bun run test:bun

          cd ../keymap
          bun run test

          cd ../..
          bun run test:dist

      - name: Create npm tarballs
        if: steps.publish_plan.outputs.mode != 'skip'
        run: |
          set -euo pipefail

          mkdir -p npm-tarballs

          bun scripts/publish-scoped.ts \
            --scope "$NPM_SCOPE" \
            --package-prefix "$NPM_PACKAGE_PREFIX" \
            --tag "${{ steps.publish_plan.outputs.npm_tag }}" \
            --skip-existing \
            --pack-destination npm-tarballs \
            --pack-only

      - name: Upload npm tarballs
        if: steps.publish_plan.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: jitl-npm-tarballs
          path: npm-tarballs/*
          if-no-files-found: error

  smoke_tarballs:
    name: Install tarballs with npm only
    needs: build_tarballs
    if: needs.build_tarballs.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert Bun is unavailable
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "This smoke test must run without Bun on PATH."
            exit 1
          fi

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: jitl-npm-tarballs
          path: npm-tarballs

      - name: Install and smoke-test tarballs
        run: node scripts/smoke-test-tarballs.mjs npm-tarballs --scope "$NPM_SCOPE" --package-prefix "$NPM_PACKAGE_PREFIX"

  publish:
    name: Publish @jitl packages
    needs:
      - build_tarballs
      - smoke_tarballs
    if: needs.build_tarballs.outputs.mode != 'skip' && github.repository == 'justjake/opentui'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm trusted publishing prerequisites
        run: |
          node --version
          npm --version

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: jitl-npm-tarballs
          path: npm-tarballs

      - name: Publish scoped tarballs
        run: |
          set -euo pipefail

          DRY_RUN_ARG=""
          if [ "${{ needs.build_tarballs.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          node scripts/publish-tarballs.mjs \
            npm-tarballs \
            --tag "${{ needs.build_tarballs.outputs.npm_tag }}" \
            --skip-existing \
            $DRY_RUN_ARG

      - name: Report publish
        run: |
          {
            echo "### Published \`${NPM_SCOPE}/*@${{ needs.build_tarballs.outputs.version }}\`"
            echo ""
            echo "- npm tag: \`${{ needs.build_tarballs.outputs.npm_tag }}\`"
            echo "- dry run: \`${{ needs.build_tarballs.outputs.dry_run }}\`"
            echo "- core package: ${{ needs.build_tarballs.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  report_skip:
    name: Report skipped publish
    needs: build_tarballs
    if: needs.build_tarballs.outputs.mode == 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Report skip
        run: |
          echo "Skipped publish; ${{ needs.build_tarballs.outputs.url }} already exists."
          echo "::notice title=Skipped publish (already on npm)::${{ needs.build_tarballs.outputs.url }}"
