name: Build Solid

on:
  push:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  test:
    if: github.repository == 'anomalyco/opentui'
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun install

      - name: Clear stale native outputs
        run: rm -rf .zig-cache packages/core/src/zig/.zig-cache packages/core/src/zig/lib packages/core/node_modules/@opentui/core-*

      - name: Build core
        run: |
          cd packages/core
          bun run build

      - name: Build
        run: |
          cd packages/solid
          bun run build --ci

      - name: Run tests
        run: |
          cd packages/solid
          bun run test

  # Gate job for branch protection
  build-complete:
    name: Solid - Build and Test
    needs: [test]
    runs-on: ubuntu-latest
    if: github.repository == 'anomalyco/opentui' && always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"
